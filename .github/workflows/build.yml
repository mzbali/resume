name: Upload résumé PDF

permissions:
  contents: write

# Publishes to GitHub Pages only from main. Other branches and pull requests
# never deploy, so a branch can hold an unpublished resume.
on:
  push:
    branches:
      - "main"
    paths:
      - "resume.pdf"
      - "index.html"
      - ".github/workflows/**"

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Post Processing
        run: |
          mkdir build 
          cp resume.pdf build/ 
          cp index.html build/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
